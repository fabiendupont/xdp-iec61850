SPECIFICATION FairSpec

\* Comprehensive configuration for thorough verification (larger state space)
\* Runtime: ~10-30 minutes on modern hardware
\* Recommended for final verification before production

CONSTANTS
    MAX_STNUM = 5
    MAX_SQNUM = 10
    PUBLISHERS = {pub1}
    SUBSCRIBERS = {sub1, sub2, sub3}
    NETWORK_DELAY = 3
    MAX_RETRANSMITS = 6
    DATA_VALUES = {0, 1, 2}

\* Type invariant (always check)
INVARIANT TypeOK

\* Safety properties
INVARIANT SubscriberDataConsistent
INVARIANT ReceivedDataValid

\* Temporal properties
PROPERTY StateNumberMonotonic
PROPERTY SequenceNumberResets
PROPERTY EventualDelivery
PROPERTY EventualIdleOrRetransmit

\* State space constraints
CONSTRAINT StateConstraintBasic

\* Deadlock checking
CHECK_DEADLOCK FALSE
