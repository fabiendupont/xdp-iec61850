SPECIFICATION Spec

\* Comprehensive configuration for thorough model checking
\* Runtime: ~4-5 minutes on modern hardware (7.4M distinct states, depth 92)

CONSTANTS
    MAX_STNUM = 3
    MAX_SQNUM = 6
    PUBLISHERS = {pub1}
    SUBSCRIBERS = {sub1, sub2, sub3}
    NETWORK_DELAY = 3
    MAX_RETRANSMITS = 6
    DATA_VALUES = {0, 1, 2}

\* Type invariant (always check)
INVARIANT TypeOK

\* State-based safety invariants (no temporal operators)
INVARIANT SubscriberDataConsistent
INVARIANT ReceivedDataValid

\* Action-based safety properties (use PROPERTY for temporal formulas)
PROPERTY StateNumberMonotonic
PROPERTY SequenceNumberResets

\* Liveness properties
\* NOTE: Comment out for faster checking, uncomment for full verification
\* PROPERTY EventualDelivery
\* PROPERTY EventualIdleOrRetransmit

\* State space constraints to make checking feasible
CONSTRAINT StateConstraintBasic

\* Symmetry reduction (subscribers are interchangeable)
\* NOTE: SYMMETRY requires Permutations() - disabled for now
\* SYMMETRY Permutations(SUBSCRIBERS)
