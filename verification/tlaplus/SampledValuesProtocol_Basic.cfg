SPECIFICATION Spec

\* Basic configuration for model checking
\* Models sampled values scenario (IEC 61850-9-2LE)
\* Runtime: Target < 15 minutes (state space reduced for CI)
\* 1 subscriber, global_time <= 10, network <= 2, history <= 4
\* to ensure CI completion within 1 hour timeout

CONSTANTS
    MAX_SMPCNT = 4
    PUBLISHERS = {pub1}
    SUBSCRIBERS = {sub1}
    SAMPLING_INTERVAL = 2
    MAX_LATENCY = 2
    NUM_CHANNELS = 1
    SAMPLE_VALUES = {0, 1}

\* Type invariant (always check)
INVARIANT TypeOK

\* State-based safety invariants (no temporal operators)
INVARIANT SubscriberSampleConsistent
INVARIANT GapDetectionQuality
INVARIANT LatencyBound
INVARIANT SamplesInOrder
\* NOTE: TimelyDeliveryOrDrop removed - time and network propagation are
\* independent actions in the model, so global_time can advance without TTL
\* decreasing. LatencyBound (ttl <= MAX_LATENCY) is sufficient.

\* Action-based safety properties (use PROPERTY for temporal formulas)
PROPERTY SampleCounterMonotonic
PROPERTY SamplingIntervalMaintained

\* State space constraints to make checking feasible
CONSTRAINT StateConstraintBasic

\* Symmetry reduction (subscribers are interchangeable)
\* NOTE: SYMMETRY requires Permutations() - disabled for now
\* SYMMETRY Permutations(SUBSCRIBERS)
