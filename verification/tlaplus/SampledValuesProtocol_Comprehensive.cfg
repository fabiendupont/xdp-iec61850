SPECIFICATION Spec

\* Comprehensive configuration
\* Models larger sample space with multiple subscribers
\* Runtime: ~15-45 minutes

CONSTANTS
    MAX_SMPCNT = 6
    PUBLISHERS = {pub1}
    SUBSCRIBERS = {sub1}
    SAMPLING_INTERVAL = 2
    MAX_LATENCY = 2
    NUM_CHANNELS = 1
    SAMPLE_VALUES = {0, 1, 2}

\* Type invariant
INVARIANT TypeOK

\* Safety properties
INVARIANT SubscriberSampleConsistent
INVARIANT GapDetectionQuality
INVARIANT LatencyBound
INVARIANT SamplesInOrder

\* Temporal properties
PROPERTY SampleCounterMonotonic
PROPERTY SamplingIntervalMaintained

\* State space constraints
CONSTRAINT StateConstraintBasic

\* Deadlock checking
CHECK_DEADLOCK FALSE
