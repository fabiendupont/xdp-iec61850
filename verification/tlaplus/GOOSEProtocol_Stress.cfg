SPECIFICATION FairSpec

\* Stress configuration for overnight CI verification
\* Runtime: 1-4 hours depending on hardware
\* Explores maximum state space with multiple publishers

CONSTANTS
    MAX_STNUM = 8
    MAX_SQNUM = 16
    PUBLISHERS = {pub1}
    SUBSCRIBERS = {sub1, sub2, sub3, sub4}
    NETWORK_DELAY = 4
    MAX_RETRANSMITS = 6
    DATA_VALUES = {0, 1, 2, 3}

\* Type invariant (always check)
INVARIANT TypeOK

\* Safety properties
INVARIANT SubscriberDataConsistent
INVARIANT ReceivedDataValid

\* Temporal properties
PROPERTY StateNumberMonotonic
PROPERTY SequenceNumberResets
PROPERTY EventualDelivery
PROPERTY EventualIdleOrRetransmit

\* State space constraints
CONSTRAINT StateConstraintBasic

\* Deadlock checking
CHECK_DEADLOCK FALSE
